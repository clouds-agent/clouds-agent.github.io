<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phigros 风格卡片布局 - 示范</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            position: relative;
            perspective: 1000px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
        }

        /* 左上角 - 粉丝折线图 */
        .card-top-left {
            background: linear-gradient(135deg, rgba(52, 199, 89, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
        }

        /* 右上角 - 点赞折线图 */
        .card-top-right {
            background: linear-gradient(135deg, rgba(255, 149, 0, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
        }

        /* 右下角 - 捏同款折线图 */
        .card-bottom-right {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
        }

        /* 左下角 - 个人信息 */
        .card-bottom-left {
            background: linear-gradient(135deg, rgba(175, 82, 222, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
        }

        .card-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            font-size: 18px;
        }

        .card-content {
            height: calc(100% - 40px);
            position: relative;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
        }

        .info-subvalue {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        .chart-container {
            position: relative;
            height: 100%;
            width: 100%;
        }

        /* 装饰元素 */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                aspect-ratio: auto;
                height: auto;
            }

            .card-grid {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 180px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-grid">
            <!-- 左上角：最近一周 - 粉丝折线图 -->
            <div class="card card-top-left">
                <div class="card-title">
                    <span class="icon">📊</span>
                    最近一周 - 粉丝
                </div>
                <div class="card-content">
                    <div class="chart-container">
                        <canvas id="fansChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 右上角：最近一周 - 点赞折线图 -->
            <div class="card card-top-right">
                <div class="card-title">
                    <span class="icon">❤️</span>
                    最近一周 - 点赞
                </div>
                <div class="card-content">
                    <div class="chart-container">
                        <canvas id="likeChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 左下角：个人信息 -->
            <div class="card card-bottom-left">
                <div class="card-title">
                    <span class="icon">👤</span>
                    个人信息
                </div>
                <div class="card-content">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">RKS</div>
                            <div class="info-value">15.79</div>
                            <div class="info-subvalue">技术力值</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">粉丝</div>
                            <div class="info-value">1154</div>
                            <div class="info-subvalue">+23 本周</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">获赞</div>
                            <div class="info-value">3.8w</div>
                            <div class="info-subvalue">+1.2k 本周</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">捏同款</div>
                            <div class="info-value">30798</div>
                            <div class="info-subvalue">+567 本周</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右下角：最近一周 - 捏同款折线图 -->
            <div class="card card-bottom-right">
                <div class="card-title">
                    <span class="icon">🎨</span>
                    最近一周 - 捏同款
                </div>
                <div class="card-content">
                    <div class="chart-container">
                        <canvas id="inheritChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Chart.js 全局配置
        Chart.defaults.color = 'rgba(255, 255, 255, 0.6)';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';
        Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

        // 通用图表配置
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    titleColor: '#fff',
                    bodyColor: '#fff',
                    borderColor: 'rgba(255, 255, 255, 0.2)',
                    borderWidth: 1,
                    padding: 12,
                    cornerRadius: 8,
                    displayColors: false
                }
            },
            scales: {
                x: {
                    grid: {
                        display: false
                    },
                    ticks: {
                        font: { size: 10 }
                    }
                },
                y: {
                    grid: {
                        color: 'rgba(255, 255, 255, 0.05)'
                    },
                    ticks: {
                        font: { size: 10 },
                        callback: function(value) {
                            if (value >= 1000) {
                                return (value / 1000).toFixed(1) + 'k';
                            }
                            return value;
                        }
                    }
                }
            }
        };

        // 粉丝折线图
        new Chart(document.getElementById('fansChart'), {
            type: 'line',
            data: {
                labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                datasets: [{
                    label: '粉丝',
                    data: [1131, 1138, 1142, 1145, 1148, 1151, 1154],
                    borderColor: '#34c759',
                    backgroundColor: 'rgba(52, 199, 89, 0.2)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#34c759',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2
                }]
            },
            options: commonOptions
        });

        // 点赞折线图
        new Chart(document.getElementById('likeChart'), {
            type: 'line',
            data: {
                labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                datasets: [{
                    label: '点赞',
                    data: [36800, 37100, 37350, 37520, 37680, 37820, 37957],
                    borderColor: '#ff9500',
                    backgroundColor: 'rgba(255, 149, 0, 0.2)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#ff9500',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2
                }]
            },
            options: commonOptions
        });

        // 捏同款折线图
        new Chart(document.getElementById('inheritChart'), {
            type: 'line',
            data: {
                labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                datasets: [{
                    label: '捏同款',
                    data: [30231, 30350, 30480, 30590, 30680, 30750, 30798],
                    borderColor: '#00d4ff',
                    backgroundColor: 'rgba(0, 212, 255, 0.2)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#00d4ff',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2
                }]
            },
            options: commonOptions
        });
    </script>
</body>
</html>
