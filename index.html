<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neta Tools</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
</head>
<body>
    <div class="header">
        <span class="signature">from CLOUDS</span>
        <div id="user-profile" class="profile-btn" title="个人主页" style="display:none;">
            <img id="header-avatar" src="" alt="头像" class="header-avatar" />
            <span id="header-name" class="header-name">-</span>
        </div>
    </div>

    <nav class="navbar">
        <a href="#like" class="nav-link active">点赞</a>
        <a href="#tools" class="nav-link">工具</a>
    </nav>

    <main class="container">
        <!-- 点赞页 -->
        <section id="like" class="section active">
            <div class="card">
                <div class="search-box">
                    <input type="text" id="tag-search" placeholder="请输入标签名" autocomplete="off" />
                    <button id="add-tag-btn" class="btn btn-add">添加</button>
                    <div id="tag-suggestions" class="suggestions"></div>
                </div>
                <div id="selected-tags" class="tag-list"></div>
                
                <div class="divider">或</div>
                
                <div class="search-box">
                    <input type="text" id="user-search" placeholder="输入用户昵称（支持模糊搜索）" autocomplete="off" />
                    <div id="user-suggestions" class="suggestions"></div>
                </div>
                <div id="selected-users" class="user-list"></div>
                
                <div class="like-speed-settings">
                    <div class="setting-row">
                        <label class="setting-label">点赞速度：</label>
                        <input type="range" id="like-speed" class="setting-range" min="50" max="2000" step="50" value="200" />
                        <span id="like-speed-value" class="setting-value">200ms</span>
                    </div>
                    <div class="setting-desc-row">
                        <span class="setting-desc">快速 (50ms) ← → 慢速 (2000ms)</span>
                    </div>
                </div>
                
                <div class="timeout-settings">
                    <div class="setting-row">
                        <label class="setting-label">无增长停止时间：</label>
                        <select id="timeout-duration" class="setting-select">
                            <option value="1">1 分钟</option>
                            <option value="5">5 分钟</option>
                            <option value="10">10 分钟</option>
                            <option value="0">无截止时间</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label class="setting-label">应用范围：</label>
                        <select id="timeout-scope" class="setting-select">
                            <option value="all">整体</option>
                            <option value="except-users">除用户</option>
                            <option value="except-tags">除标签</option>
                        </select>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button id="start-like" class="btn btn-primary">开始</button>
                    <button id="pause-like" class="btn btn-secondary" disabled>暂停</button>
                </div>
                <div id="like-progress" class="progress"></div>
                <div id="like-chart" class="chart"></div>
                <div id="like-log" class="log"></div>
            </div>
            <div class="card">
                <h3>热门标签</h3>
                <div id="hot-tags" class="hot-tags"></div>
            </div>
            <div class="card">
                <button id="load-ranking" class="btn btn-secondary">加载热度排行 TOP20</button>
                <div id="ranking-list" class="ranking-list"></div>
            </div>
        </section>

        <!-- 工具页 -->
        <section id="tools" class="section">
            <div class="card">
                <h3>📊 数据统计</h3>
                <div class="stats-tabs">
                    <button class="stats-tab active" data-type="fans">粉丝</button>
                    <button class="stats-tab" data-type="like">点赞</button>
                    <button class="stats-tab" data-type="inherit">捏同款</button>
                </div>
                <div class="stats-controls">
                    <select id="stats-range" class="stats-select">
                        <!-- 粉丝选项 -->
                        <option value="1" data-for="fans">最近 1 天</option>
                        <option value="7" data-for="fans" selected>最近 1 周</option>
                        <option value="30" data-for="fans">最近 1 月</option>
                        <option value="90" data-for="fans">最近 3 月</option>
                        <option value="all" data-for="fans">全部</option>
                        <!-- 点赞选项 -->
                        <option value="1" data-for="like" style="display:none">最近 1 天</option>
                        <option value="3" data-for="like" style="display:none">最近 3 天</option>
                        <option value="7" data-for="like" style="display:none">最近 1 周</option>
                        <option value="14" data-for="like" style="display:none">最近 2 周</option>
                        <!-- 捏同款选项 -->
                        <option value="1" data-for="inherit" style="display:none">最近 1 天</option>
                        <option value="3" data-for="inherit" style="display:none">最近 3 天</option>
                        <option value="7" data-for="inherit" style="display:none">最近 1 周</option>
                        <option value="14" data-for="inherit" style="display:none">最近 2 周</option>
                    </select>
                    <button id="load-stats" class="btn btn-primary">加载数据</button>
                </div>
                <div id="stats-summary" class="stats-summary"></div>
                <div id="stats-chart-wrapper" class="chart-wrapper">
                    <canvas id="stats-chart"></canvas>
                </div>
            </div>
            <div class="card">
                <h3>UUID 查询</h3>
                <div class="search-box">
                    <input type="text" id="uuid-search" placeholder="搜索角色或元素（输入关键词自动联想）" autocomplete="off" />
                    <div id="uuid-suggestions" class="suggestions"></div>
                </div>
                <div id="uuid-result" class="result"></div>
            </div>
            
            <div class="card">
                <h3>🖼️ 我的图库</h3>
                <div class="gallery-controls">
                    <div class="gallery-filter">
                        <label class="gallery-label">类型：</label>
                        <select id="gallery-modality" class="gallery-select">
                            <option value="PICTURE">图片</option>
                            <option value="VIDEO">视频</option>
                        </select>
                    </div>
                    <button id="load-gallery" class="btn btn-primary">加载图库</button>
                </div>
                <div id="gallery-stats" class="gallery-stats"></div>
                <div id="gallery-grid" class="gallery-grid"></div>
                <div id="gallery-loading" class="gallery-loading" style="display:none">加载中...</div>
                <button id="load-more-gallery" class="btn btn-secondary" style="display:none">加载更多</button>
            </div>
        </section>
    </main>

    <!-- 个人主页悬浮窗 -->
    <div id="profile-modal" class="modal">
        <div class="modal-content profile-modal">
            <div class="modal-header">
                <h3>个人主页</h3>
                <button class="modal-close" onclick="closeProfile()">×</button>
            </div>
            <div class="profile-body">
                <div class="profile-header-section">
                    <div class="profile-avatar-name-row">
                        <div class="profile-avatar-large">
                            <img id="profile-avatar-img" src="" alt="头像" />
                        </div>
                        <div class="profile-name-large" id="profile-name">-</div>
                    </div>
                </div>
                <div class="profile-stats-large">
                    <div class="stat-row">
                        <div class="stat-large">
                            <div class="stat-value-large" id="profile-following">-</div>
                            <div class="stat-label-large">关注</div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-large">
                            <div class="stat-value-large" id="profile-followers">-</div>
                            <div class="stat-label-large">粉丝</div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-large">
                            <div class="stat-value-large" id="profile-energy">-</div>
                            <div class="stat-label-large">电量</div>
                        </div>
                    </div>
                    <div class="stat-row stat-row-second">
                        <div class="stat-large">
                            <div class="stat-value-large" id="profile-likes">-</div>
                            <div class="stat-label-large">获赞</div>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-large stat-large-with-refresh">
                            <div class="stat-value-large" id="profile-same-style">-</div>
                            <div class="stat-label-large">捏同款</div>
                            <button id="refresh-profile-btn" class="btn-refresh-inline" title="刷新数据">
                                ↻
                            </button>
                        </div>
                    </div>
                </div>
                <div class="profile-actions">
                    <button id="checkin-btn" class="btn btn-primary btn-full btn-lg">签到</button>
                    <div id="checkin-status" class="status"></div>
                </div>
                <div class="profile-settings">
                    <div class="setting-item">
                        <div class="setting-info">
                            <div class="setting-title">定时签到</div>
                            <div class="setting-desc">每天 0:01 自动签到</div>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" id="auto-checkin-toggle" />
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                <div class="profile-footer">
                    <button id="logout-btn" class="btn btn-secondary btn-full">退出登录</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 用户确认悬浮窗 -->
    <div id="user-confirm-modal" class="modal">
        <div class="modal-content user-confirm-modal">
            <div class="modal-header">
                <h3>确认用户</h3>
                <button class="modal-close" onclick="closeUserConfirmModal()">×</button>
            </div>
            <div class="user-confirm-body">
                <div class="user-card" id="user-confirm-card">
                    <img id="confirm-avatar" src="" alt="头像" class="confirm-avatar" />
                    <div class="confirm-info">
                        <div class="confirm-name" id="confirm-name">-</div>
                        <div class="confirm-stats">
                            <span><strong id="confirm-followers">0</strong> 粉丝</span>
                            <span><strong id="confirm-stories">0</strong> 作品</span>
                        </div>
                    </div>
                </div>
                <button id="confirm-add-user" class="btn btn-primary btn-full">添加到任务队列</button>
            </div>
        </div>
    </div>

    <!-- Token 登录悬浮窗 -->
    <div id="login-modal" class="modal show">
        <div class="modal-content modal-login">
            <div class="modal-header">
                <h3>登录</h3>
                <button class="modal-close" onclick="closeLoginModal()">×</button>
            </div>
            <div class="login-body">
                <p class="login-tip">打开网页版捏 ta - 个人主页左上角 - 隐私设置 - 获取 NETA TOKEN</p>
                <input type="text" id="token-input" placeholder="输入 NETA TOKEN" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
                <button id="login-btn" class="btn btn-primary btn-full">登录</button>
                <div id="login-status" class="status"></div>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260520v36"></script>
</body>
</html>
