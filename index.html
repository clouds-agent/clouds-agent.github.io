<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neta Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <span class="signature">from CLOUDS</span>
    </div>

    <nav class="navbar">
        <a href="#like" class="nav-link active">点赞</a>
        <a href="#tools" class="nav-link">工具</a>
        <a href="#token" class="nav-link">Token</a>
    </nav>

    <main class="container">
        <!-- Token 页 -->
        <section id="token" class="section">
            <div class="card">
                <input type="password" id="token-input" placeholder="输入 Neta Token" />
                <button id="save-token" class="btn btn-primary">保存</button>
                <button id="clear-token" class="btn btn-secondary">清除</button>
                <div id="token-status" class="status"></div>
                <a href="https://www.neta.art/open/" target="_blank" class="link">获取 Token →</a>
            </div>
        </section>

        <!-- 点赞页 -->
        <section id="like" class="section active">
            <div class="card">
                <div class="search-box">
                    <input type="text" id="tag-search" placeholder="搜索标签（输入关键词自动联想）" autocomplete="off" />
                    <div id="tag-suggestions" class="suggestions"></div>
                </div>
                <div id="selected-tags" class="tag-list"></div>
                <div class="btn-group">
                    <button id="start-like" class="btn btn-primary">开始</button>
                    <button id="pause-like" class="btn btn-secondary" disabled>暂停</button>
                </div>
                <div id="like-progress" class="progress"></div>
                <div id="like-chart" class="chart"></div>
                <div id="like-log" class="log"></div>
            </div>
            <div class="card">
                <button id="load-ranking" class="btn btn-secondary">加载热度排行 TOP20</button>
                <div id="ranking-list" class="ranking-list"></div>
            </div>
        </section>

        <!-- 工具页 -->
        <section id="tools" class="section">
            <div class="card">
                <h3>UUID 查询</h3>
                <div class="search-box">
                    <input type="text" id="uuid-search" placeholder="搜索角色或元素（输入关键词自动联想）" autocomplete="off" />
                    <div id="uuid-suggestions" class="suggestions"></div>
                </div>
                <div id="uuid-result" class="result"></div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
